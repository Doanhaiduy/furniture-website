version: '3.8'

services:
  app:
    container_name: furniture-website-app
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      secrets:
        - NEXT_PUBLIC_SUPABASE_URL
        - NEXT_PUBLIC_SUPABASE_ANON_KEY
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # Internal connection to Supabase (via Kong gateway in the shared Docker network)
      - SUPABASE_URL_INTERNAL=http://supabase-kong:8000
    networks:
      - app-network
      - supabase-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  app-network:
    name: furniture-app-network
  supabase-network:
    external: true
    name: supabase_default

secrets:
  NEXT_PUBLIC_SUPABASE_URL:
    environment: "NEXT_PUBLIC_SUPABASE_URL"
  NEXT_PUBLIC_SUPABASE_ANON_KEY:
    environment: "NEXT_PUBLIC_SUPABASE_ANON_KEY"
