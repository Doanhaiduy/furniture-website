services:
  app:
    container_name: furniture-website-app
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - SUPABASE_URL_INTERNAL=http://supabase_kong_furniture-website:8000
      - DATABASE_URL=postgresql://postgres:postgres@supabase_db_furniture-website:5432/postgres
    env_file:
      - .env
    networks:
      - default
      - supabase_network

networks:
  supabase_network:
    name: supabase_network_furniture-website
    external: true
